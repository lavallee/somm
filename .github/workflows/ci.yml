name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Sync workspace (all packages + dev group)
        run: uv sync --all-packages --frozen
      # Uses the repo's existing [tool.ruff] config (pyproject.toml). Some
      # pre-existing violations are not yet fixed — see CONTRIBUTING.md /
      # project notes for status; new code should not add to the count.
      - name: Lint (ruff check)
        run: uv run ruff check packages/ tests/ --output-format=github
      - name: Run tests
        run: uv run pytest -q
