# Publishes all somm workspace packages to PyPI via trusted publishing
# (OIDC — no stored API tokens).
#
# PREREQUISITE: a trusted publisher must be configured on PyPI for EACH
# package. PyPI requires *pending* publishers (used before a project
# first exists) to be unique per (repo, workflow, environment) — so each
# package gets its own GitHub environment, "pypi-<package>":
#
#   package         environment
#   somm            pypi-somm
#   somm-core       pypi-somm-core
#   somm-service    pypi-somm-service
#   somm-mcp        pypi-somm-mcp
#   somm-langchain  pypi-somm-langchain
#   somm-skill      pypi-somm-skill
#
# Register each pending publisher at PyPI → Account settings →
# Publishing with: owner "lavallee", repo "somm", workflow
# "publish.yml", and the environment from the table above. The GitHub
# environments are created automatically on first workflow run.
name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - somm
          - somm-core
          - somm-service
          - somm-mcp
          - somm-langchain
          - somm-skill
    environment:
      name: pypi-${{ matrix.package }}
      url: https://pypi.org/p/${{ matrix.package }}
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Build ${{ matrix.package }}
        # NB: in a uv workspace, `uv build` from a member dir writes to the
        # WORKSPACE ROOT dist/ — pass --out-dir explicitly so the publish
        # step finds the artifacts.
        run: uv build --package ${{ matrix.package }} --out-dir dist-${{ matrix.package }}
      - name: Publish ${{ matrix.package }} to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist-${{ matrix.package }}/
          # Idempotent re-runs: a version already on PyPI is skipped, not an
          # error — needed when a partial publish (e.g. staged pending-
          # publisher registration) is completed by re-dispatching.
          skip-existing: true
